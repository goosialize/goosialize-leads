name: Goosialize Leads
slug: goosialize-leads
type: plugin
version: 0.1.0-dev
description: PLUGIN_GOOSIALIZE_LEADS.DESCRIPTION
author:
  name: Goosialize Ltd
  email: agency@goosialize.com

# LICENSING_DECISION_REQUIRED

dependencies:
  - name: grav
    version: '>=2.0.12 <2.1.0'

compatibility:
  grav:
    - '2.0'

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_LEADS.ENABLED
      help: PLUGIN_GOOSIALIZE_LEADS.ENABLED_HELP
      highlight: 1
      default: 1
      options:
        1: PLUGIN_GOOSIALIZE_LEADS.OPTION_ENABLED
        0: PLUGIN_GOOSIALIZE_LEADS.OPTION_DISABLED
      validate:
        type: bool
    forms.enabled:
      type: toggle
      label: PLUGIN_GOOSIALIZE_LEADS.FORMS_ENABLED
      default: 0
      options:
        1: PLUGIN_GOOSIALIZE_LEADS.OPTION_ENABLED
        0: PLUGIN_GOOSIALIZE_LEADS.OPTION_DISABLED
      validate:
        type: bool
    forms.forms:
      type: array
      label: PLUGIN_GOOSIALIZE_LEADS.FORMS_LIST
      default: []
      value_only: true
      validate:
        type: array
    forms.source:
      type: text
      label: PLUGIN_GOOSIALIZE_LEADS.FORMS_SOURCE
      default: website
      validate:
        required: true
        pattern: '^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$'
    forms.locale:
      type: text
      label: PLUGIN_GOOSIALIZE_LEADS.FORMS_LOCALE
      default: null
      validate:
        pattern: '^[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})*$'
    forms.consent_version:
      type: text
      label: PLUGIN_GOOSIALIZE_LEADS.FORMS_CONSENT_VERSION
      default: privacy-v1
      validate:
        required: true
        pattern: '^[a-z0-9](?:[a-z0-9_-]{0,62}[a-z0-9])?$'
    forms.success_redirect:
      type: text
      label: PLUGIN_GOOSIALIZE_LEADS.FORMS_SUCCESS_REDIRECT
      default: /
      validate:
        required: true
    public_api.enabled:
      type: toggle
      label: Public JSON API
      default: 0
      options:
        1: PLUGIN_GOOSIALIZE_LEADS.OPTION_ENABLED
        0: PLUGIN_GOOSIALIZE_LEADS.OPTION_DISABLED
      validate:
        type: bool
    public_api.allowed_origins:
      type: array
      label: Allowed Origins
      default: []
      value_only: true
      validate:
        type: array
    public_api.locale:
      type: text
      label: Public API locale
      default: null
      validate:
        pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$'
    public_api.consent_version:
      type: text
      label: Public API consent version
      default: privacy-v1
      validate:
        required: true
        pattern: '^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$'
    public_api.body_max_bytes:
      type: display
      label: Maximum raw body bytes
      default: 16384
    public_api.json_max_depth:
      type: display
      label: Maximum JSON depth
      default: 4
    public_api.rate_limit_count:
      type: display
      label: Requests per window
      default: 10
    public_api.rate_limit_window_seconds:
      type: display
      label: Rate-limit window seconds
      default: 60
