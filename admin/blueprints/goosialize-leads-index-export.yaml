name: Goosialize Leads Index
form:
  validation: strict
  fields:
    leads:
      type: resource-table
      endpoint: /goosialize-leads
      export_endpoint: /goosialize-leads/export
      export_supported_filters: []
      id_key: id
      filters:
      - name: search
        section: search
        type: text
        label: Search
        placeholder: Search name, email, source or Lead ID
        fields:
        - id
        - name
        - email
        - source
        operator: contains
      - name: status
        type: select
        label: Status
        field: status
        operator: equals
        options_from_meta: allowed_statuses
      - name: source
        type: select
        label: Source
        field: source
        operator: equals
        options_from_field: source
      - name: date_from
        type: datetime
        label: Created from
        field: created_at
        operator: date-from
      - name: date_to
        type: datetime
        label: Created to
        field: created_at
        operator: date-to
      columns:
      - key: created_at
        label: Created
      - key: name
        label: Name
      - key: email
        label: Email
      - key: phone
        label: Phone
      - key: source
        label: Source
      - key: form_or_resource
        label: Form / Resource
      - key: status
        label: Status
      actions:
        clear: true
        refresh: true
        export: true
      empty_message: No leads have been captured yet.
      filtered_empty_message: No leads match the active filters.
      load_error_message: Lead data could not be loaded.
