name: Goosialize Leads

form:
  validation: loose

  fields:
    filters_panel:
      type: fieldset
      title: Filters
      description: Filter leads by status, source, state or creation date.
      collapsible: true
      collapsed: true

      fields:
        filters.search:
          type: text
          label: Search
          placeholder: Search by name, email, phone, source or resource
          style: vertical

        status_source_state:
          type: columns

          fields:
            status_column:
              type: column

              fields:
                filters.status:
                  type: select
                  label: Status
                  style: vertical
                  default: ''
                  options:
                    '': All statuses
                    new: New
                    contacted: Contacted
                    qualified: Qualified
                    closed: Closed

            source_column:
              type: column

              fields:
                filters.source:
                  type: select
                  label: Source
                  style: vertical
                  default: ''
                  options:
                    '': All sources

            state_column:
              type: column

              fields:
                filters.state:
                  type: select
                  label: State
                  style: vertical
                  default: ''
                  options:
                    '': All states
                    active: Active
                    inactive: Inactive
                    deleted: Deleted

            form_resource_column:
              type: column

              fields:
                filters.form_resource:
                  type: select
                  label: Form / Resource
                  style: vertical
                  default: ''
                  options:
                    '': All forms / resources

        created_dates:
          type: columns

          fields:
            created_from_column:
              type: column

              fields:
                filters.date_from:
                  type: datetime
                  label: Created from
                  style: vertical

            created_to_column:
              type: column

              fields:
                filters.date_to:
                  type: datetime
                  label: Created to
                  style: vertical

    leads_workspace:
      type: leads-workspace
      style: vertical
