name: Goosialize Leads Index

form:
  validation: strict
  fields:
    leads:
      type: resource-table
      endpoint: /goosialize-leads
      id_key: id
      filters:
        - name: search
          section: search
          type: text
          label: Search
          placeholder: Search name, email, source or Lead ID
          fields:
            - id
            - name
            - email
            - source
          operator: contains
        - name: status
          type: select
          label: Status
          field: status
          operator: equals
          options_from_meta: allowed_statuses
        - name: source
          type: select
          label: Source
          field: source
          operator: equals
          options_from_field: source
        - name: date_from
          type: datetime
          label: Created from
          field: created_at
          operator: date-from
        - name: date_to
          type: datetime
          label: Created to
          field: created_at
          operator: date-to
      columns:
        - name: created_at
          label: Created
          format: datetime
          width: '18%'
        - name: name
          label: Name
          width: '18%'
        - name: email
          label: Email
          width: '24%'
        - name: source
          label: Source
          width: '14%'
        - name: form_name
          label: Form
          width: '12%'
        - name: status
          label: Status
          width: '14%'
      actions:
        clear: true
        refresh: true
        export: false
      empty_message: No leads have been captured yet.
      filtered_empty_message: No leads match the active filters.
      load_error_message: Lead data could not be loaded.
